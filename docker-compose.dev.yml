services:
  db:
    image: postgres:14-alpine
    environment:
      POSTGRES_PASSWORD: s3ase
      POSTGRES_USER: s3ase
      POSTGRES_DB: s3ase
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U s3ase -d s3ase"]
      interval: 2s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: s3ase
      MINIO_ROOT_PASSWORD: s3ase-development
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 3s
      retries: 20

  db-migration:
    build:
      context: ./backend
      dockerfile: Dockerfile
    entrypoint: ["./s3ase", "migrate", "up"]
    depends_on:
      db:
        condition: service_healthy
    environment: &backend-environment
      NODE_ENV: development
      ENCRYPTION_KEY: development-only-change-me-key!!
      DB_DRIVER: postgres
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: s3ase
      DB_PASSWORD: s3ase
      DB_DATABASE: s3ase
      DB_OPTIONS: sslmode=disable&connect_timeout=30
      REDIS_HOST: redis
      REDIS_PORT: 6379
      AWS_ACCESS_KEY: s3ase
      AWS_SECRET_KEY: s3ase-development
      AWS_DEFAULT_REGION: us-east-1
      AWS_ENDPOINT: http://minio:9000
      AWS_USE_PATH_STYLE: "true"
      AUTH_REDIRECT_URL: http://localhost:5555
      AUTH_UI_REDIRECT_URL: http://localhost:3000/auth/callback
      DOMAIN_CNAME_TARGET: files.s3ase.dev
      CORS_ALLOWED_ORIGINS: http://localhost:3000

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    entrypoint: ["./s3ase", "server"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      db-migration:
        condition: service_completed_successfully
    environment: *backend-environment
    ports:
      - "5555:5555"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - backend
    environment:
      NODE_ENV: production
      SESSION_SECRET: development-session-secret
      BACKEND_URL: http://backend:5555/api
      PUBLIC_BACKEND_URL: http://localhost:5555/api
    ports:
      - "3000:3000"

volumes:
  postgres-data:
  redis-data:
  minio-data:
